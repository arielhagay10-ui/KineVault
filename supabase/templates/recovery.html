<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset your KineVault password</title></head>
  <body style="margin:0;background:#f5f6f8;color:#1c2730;font-family:Arial,sans-serif;">
    <table role="presentation" style="width:100%;border-collapse:collapse;"><tr><td style="padding:40px 20px;">
      <table role="presentation" style="width:100%;max-width:520px;margin:auto;border-collapse:collapse;"><tr><td>
        <p style="margin:0 0 28px;font-size:20px;font-weight:700;color:#314e65;">KineVault</p>
        <h1 style="margin:0 0 20px;font-size:28px;line-height:1.3;">Choose a new password</h1>
        <p style="font-size:16px;line-height:1.7;">We received a request to reset the password for your KineVault account.</p>
        <p style="margin:28px 0;"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;redirect_to={{ .RedirectTo | urlquery }}" style="display:inline-block;padding:15px 24px;border-radius:12px;background:#314e65;color:#ffffff;text-decoration:none;font-size:16px;font-weight:700;">Reset password</a></p>
        <p style="font-size:14px;line-height:1.7;color:#4e5d6a;">The link expires in one hour and works once. If you did not request a reset, ignore this email. Your password will stay the same.</p>
      </td></tr></table>
    </td></tr></table>
  </body>
</html>
