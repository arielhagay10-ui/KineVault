name: CI

on:
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workshop-mcp:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/workshop-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/workshop-mcp/package-lock.json
      - run: bash scripts/ci-install.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test

  application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: bash scripts/ci-install.sh
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:worker
      - run: npm run build

  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: bash scripts/ci-install.sh
      - run: npx supabase start --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npm run db:test -- --migrations
      - run: npm run recovery:database
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: catalog-load
          path: |
            .local-artifacts/catalog-load/
            .local-artifacts/catalog-http-load/
            .local-artifacts/operations/
          include-hidden-files: true

  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The e2e command below passes the shard total; keep it in step with this list.
        # Variants marked "Runs nightly" are skipped here; see nightly.yml.
        include:
          - { suite: e2e, shard: 1 }
          - { suite: e2e, shard: 2 }
          - { suite: e2e, shard: 3 }
          - { suite: e2e, shard: 4 }
          - { suite: e2e, shard: 5 }
          - { suite: media, shard: 1 }
          - { suite: readiness, shard: 1 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: bash scripts/ci-install.sh
      # Only readiness covers Firefox and WebKit.
      - run: npx playwright install --with-deps ${{ matrix.suite == 'readiness' && 'chromium firefox webkit' || 'chromium' }}
      - run: npx supabase start --exclude realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Configure local browser test environment
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$(npx supabase status -o env | sed -n 's/^API_URL=//p' | tr -d '"')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(npx supabase status -o env | sed -n 's/^ANON_KEY=//p' | tr -d '"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(npx supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY=//p' | tr -d '"')" >> "$GITHUB_ENV"
          render_token=$(openssl rand -hex 32)
          echo "::add-mask::$render_token"
          echo "RENDER_WORKER_TOKEN=$render_token" >> "$GITHUB_ENV"
      # Shard 1 holds the slowest spec, so the short checks run on shard 2.
      - run: npm run recovery:storage
        if: matrix.suite == 'e2e' && matrix.shard == 2
      - run: npm run build
      - name: Run e2e shard
        if: matrix.suite == 'e2e'
        # Specs are split by measured duration; see scripts/lib/e2e-shards.mjs.
        run: |
          specs=$(node scripts/e2e-shard.mjs ${{ matrix.shard }}/5)
          npm run test:e2e -- --reporter=list $specs
        env:
          KINEVAULT_E2E_PRODUCTION: "1"
      - name: Check preview initialization in development
        if: matrix.suite == 'e2e' && matrix.shard == 2
        run: npx playwright test tests/e2e/workshop-preview-regression.spec.ts
      - run: npm run test:media -- --reporter=list
        if: matrix.suite == 'media'
        env:
          KINEVAULT_E2E_PRODUCTION: "1"
      - name: Start production app for readiness checks
        if: matrix.suite == 'readiness'
        run: |
          npm start > /tmp/kinevault-readiness-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kinevault-readiness-server.log
          exit 1
      # Firefox needs a display for Mesa's software WebGL on Linux runners.
      - run: xvfb-run -a npm run test:readiness
        if: matrix.suite == 'readiness'
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures-${{ matrix.suite }}-${{ matrix.shard }}
          path: |
            test-results/**/error-context.md
            test-results/**/*.png
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-readiness-${{ matrix.suite }}-${{ matrix.shard }}
          path: |
            .local-artifacts/readiness/
            .local-artifacts/efficiency-review/
            .local-artifacts/operations/
          include-hidden-files: true
          if-no-files-found: ignore
