name: Nightly

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

# Runs the variants that pull requests skip as "Runs nightly".
env:
  KINEVAULT_FULL_SUITE: "1"

jobs:
  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [performance, studio-machines, media, readiness]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Only readiness covers Firefox and WebKit.
      - run: npx playwright install --with-deps ${{ matrix.suite == 'readiness' && 'chromium firefox webkit' || 'chromium' }}
      - run: npx supabase start --exclude realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Configure local browser test environment
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$(npx supabase status -o env | sed -n 's/^API_URL=//p' | tr -d '"')" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(npx supabase status -o env | sed -n 's/^ANON_KEY=//p' | tr -d '"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(npx supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY=//p' | tr -d '"')" >> "$GITHUB_ENV"
          render_token=$(openssl rand -hex 32)
          echo "::add-mask::$render_token"
          echo "RENDER_WORKER_TOKEN=$render_token" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run test:e2e -- --reporter=list tests/e2e/studio-machines.spec.ts
        if: matrix.suite == 'studio-machines'
        env:
          KINEVAULT_E2E_PRODUCTION: "1"
      - run: npm run test:media -- --reporter=list
        if: matrix.suite == 'media'
        env:
          KINEVAULT_E2E_PRODUCTION: "1"
      - name: Start production app
        if: matrix.suite == 'performance' || matrix.suite == 'readiness'
        run: |
          npm start > /tmp/kinevault-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kinevault-server.log
          exit 1
      - run: npm run test:performance
        if: matrix.suite == 'performance'
      # Firefox needs a display for Mesa's software WebGL on Linux runners.
      - run: xvfb-run -a npm run test:readiness
        if: matrix.suite == 'readiness'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-${{ matrix.suite }}
          path: |
            .local-artifacts/readiness/
            .local-artifacts/efficiency-review/
            .local-artifacts/supports/performance/
            .local-artifacts/operations/
            test-results/**/error-context.md
            test-results/**/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
